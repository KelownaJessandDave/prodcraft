<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Thank you — Vibe, Refined.</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1937478166927042');
      fbq('track', 'PageView');

      try {
        const pendingLeadAt = Number(sessionStorage.getItem('vr_lead_pending_at'));
        const tenMinutes = 10 * 60 * 1000;

        if (pendingLeadAt && Date.now() - pendingLeadAt < tenMinutes) {
          fbq('track', 'Lead');
        }

        sessionStorage.removeItem('vr_lead_pending_at');
      } catch (error) {
        // PageView tracking still works when browser storage is unavailable.
      }
    </script>
    <!-- End Meta Pixel Code -->
  </head>

      <img

        width="1"

        alt=""
      />
    </noscript>

        <span class="brand-mark" aria-hidden="true">VR</span>
        <span>Vibe, Refined.</span>
      </a>
    </header>
    <main class="confirmation section-shell">
      <p class="eyebrow">Project received</p>
      <h1>Thanks for showing us what you made.</h1>
      <p>We&rsquo;ll review your note and contact you to arrange your free 30-minute project review.</p>
      <a class="button button-primary" href="/">Return to Vibe, Refined.</a>
    </main>
  </body>
</html>
